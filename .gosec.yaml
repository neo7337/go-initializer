# gosec configuration
# https://github.com/securego/gosec#configuration
#
# G305 (zip-slip / file traversal when extracting archives) is suppressed for
# the generator package because all zip entries are *written* by the server
# with server-controlled paths — there is no extraction from untrusted archives.
# The rule does not apply to zip.Writer.Create() calls.

global:
  # Fail the scan if any finding at severity >= medium is found.
  # (Also enforced via the -severity flag in the workflow.)
  nosec: false
  audit: true

# Per-rule suppressions
rules:
  G305:
    # Zip-slip false positive: internal/generator writes zip entries, never extracts.
    exclude:
      - internal/generator
