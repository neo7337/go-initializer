name: Security Scans

on:
    push:
        branches: [main]
        paths:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - '.github/workflows/security.yml'
            - '.gosec.yaml'
    pull_request:
        branches: [main]
        paths:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - '.github/workflows/security.yml'
            - '.gosec.yaml'

permissions: {}

jobs:
    govulncheck:
        name: govulncheck
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Run govulncheck
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@latest
                govulncheck ./...

    gosec:
        name: gosec SAST
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Run gosec
              run: |
                go install github.com/securego/gosec/v2/cmd/gosec@latest
                gosec -conf .gosec.json -severity medium ./...
