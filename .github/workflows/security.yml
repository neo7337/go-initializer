name: Security Scans

on:
    push:
        branches: [main]
        paths:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - '.github/workflows/security.yml'
            - '.gosec.yaml'
    pull_request:
        branches: [main]
        paths:
            - '**.go'
            - 'go.mod'
            - 'go.sum'
            - '.github/workflows/security.yml'
            - '.gosec.yaml'

jobs:
    govulncheck:
        name: govulncheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Run govulncheck
              run: |
                go install golang.org/x/vuln/cmd/govulncheck@latest
                govulncheck ./...

    gosec:
        name: gosec SAST
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Run gosec
              uses: securego/gosec@v2.22.1
              with:
                args: -conf .gosec.yaml -severity medium ./...
