name: Release App

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    # Step 1: Detect which folders have changed
    detect-changes:
        runs-on: ubuntu-latest
        outputs:
            frontend: ${{ steps.filter.outputs.frontend || steps.check-first.outputs.is_first }}
            backend: ${{ steps.filter.outputs.backend || steps.check-first.outputs.is_first }}
            current_tag: ${{ steps.get-tags.outputs.current_tag }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Resolve Current and Previous Tags
              id: get-tags
              run: |
                # 1. Get current tag (either from the release event or the latest available tag)
                if [ "${{ github.event_name }}" == "release" ]; then
                    CUR_TAG="${{ github.event.release.tag_name }}"
                else
                    CUR_TAG=$(git tag --sort=-creatordate | head -n 1)
                fi
                
                # 2. Get the tag before the current one
                PREV_TAG=$(git tag --sort=-creatordate | grep -A 1 "^${CUR_TAG}$" | sed -n '2p')
                
                echo "current_tag=$CUR_TAG" >> $GITHUB_OUTPUT
                echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
                echo "Building for tag: $CUR_TAG (Previous: $PREV_TAG)"
            
            - name: Check if this is the first release
              id: check-first
              run: |
                if [ -z "${{ steps.get-tags.outputs.previous_tag }}" ]; then
                    echo "is_first=true" >> $GITHUB_OUTPUT
                else
                    echo "is_first=false" >> $GITHUB_OUTPUT
                fi
            
            - name: Check for file changes
              uses: dorny/paths-filter@v3
              id: filter
              # We only run this if it's NOT the first release to avoid errors
              if: steps.check-first.outputs.is_first == 'false'
              with:
                base: ${{ steps.get-tags.outputs.previous_tag }}
                # We compare the previous tag against the current tag/commit
                ref: ${{ steps.get-tags.outputs.current_tag }}
                filters: |
                    frontend:
                        - 'frontend/**'
                    backend:
                        - 'cmd/server/**'
                        - 'internal/**'
    
    # Step 2: Build and push Frontend (If only frontend is changed)
    build-frontend:
        needs: detect-changes
        if: needs.detect-changes.outputs.frontend == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
                
            - name: Build and push frontend
              uses: docker/build-push-action@v5
              with:
                context: ./frontend
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer-web:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer-web:${{ needs.detect-changes.outputs.current_tag }}
                build-args: |
                    API_BASE_URL=${{ secrets.API_BASE_URL }}
            
            - name: Log out from Docker Hub
              run: docker logout
    
    # Step 3: Build and push backend (only if backend changed)
    build-backend:
        needs: detect-changes
        if: needs.detect-changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Log in to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
                
            - name: Build and push backend
              uses: docker/build-push-action@v5
              with:
                context: .
                file: cmd/server/Dockerfile
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer:${{ needs.detect-changes.outputs.current_tag }}

            - name: Log out from Docker Hub
              run: docker logout

    # Step 4: Cross-compile goini and publish to GitHub Release + Homebrew tap (paused)
    release-cli:
        if: false # paused — re-enable when CLI release is ready
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Run goreleaser
              uses: goreleaser/goreleaser-action@v6
              with:
                distribution: goreleaser
                version: latest
                args: release --clean
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

    create-summary:
        needs: [detect-changes, build-frontend, build-backend, release-cli]
        runs-on: ubuntu-latest
        if: always() # Ensure this runs even if builds are skipped
        steps:
        - name: Generate Summary
          run: |
            echo "### 🚀 Release Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
                echo "| Frontend | ✅ Built and Pushed |" >> $GITHUB_STEP_SUMMARY
            else
                echo "| Frontend | ⏩ Skipped (No changes) |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "${{ needs.detect-changes.outputs.backend }}" == "true" ]; then
                echo "| Backend | ✅ Built and Pushed |" >> $GITHUB_STEP_SUMMARY
            else
                echo "| Backend | ⏩ Skipped (No changes) |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "${{ needs.release-cli.result }}" == "success" ]; then
                echo "| CLI (goini) | ✅ Released via goreleaser |" >> $GITHUB_STEP_SUMMARY
            else
                echo "| CLI (goini) | ❌ goreleaser failed |" >> $GITHUB_STEP_SUMMARY
            fi