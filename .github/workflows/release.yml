name: Release App

on:
    release:
        types: [published]
    workflow_dispatch:

permissions: {}

jobs:
    # Step 1: Detect which folders have changed
    detect-changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            frontend: ${{ steps.filter.outputs.frontend || steps.check-first.outputs.is_first }}
            backend: ${{ steps.filter.outputs.backend || steps.check-first.outputs.is_first }}
            current_tag: ${{ steps.get-tags.outputs.current_tag }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Resolve Current and Previous Tags
              id: get-tags
              run: |
                # 1. Get current tag (either from the release event or the latest available tag)
                if [ "${{ github.event_name }}" == "release" ]; then
                    CUR_TAG="${{ github.event.release.tag_name }}"
                else
                    CUR_TAG=$(git tag --sort=-creatordate | head -n 1)
                fi
                
                # 2. Get the tag before the current one
                PREV_TAG=$(git tag --sort=-creatordate | grep -A 1 "^${CUR_TAG}$" | sed -n '2p')
                
                echo "current_tag=$CUR_TAG" >> $GITHUB_OUTPUT
                echo "previous_tag=$PREV_TAG" >> $GITHUB_OUTPUT
                echo "Building for tag: $CUR_TAG (Previous: $PREV_TAG)"
            
            - name: Check if this is the first release
              id: check-first
              run: |
                if [ -z "${{ steps.get-tags.outputs.previous_tag }}" ]; then
                    echo "is_first=true" >> $GITHUB_OUTPUT
                else
                    echo "is_first=false" >> $GITHUB_OUTPUT
                fi
            
            - name: Check for file changes
              uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # dorny/paths-filter@v3
              id: filter
              # We only run this if it's NOT the first release to avoid errors
              if: steps.check-first.outputs.is_first == 'false'
              with:
                base: ${{ steps.get-tags.outputs.previous_tag }}
                # We compare the previous tag against the current tag/commit
                ref: ${{ steps.get-tags.outputs.current_tag }}
                filters: |
                    frontend:
                        - 'frontend/**'
                    backend:
                        - 'cmd/server/**'
                        - 'internal/**'
    
    # Step 2: Build and push Frontend (If only frontend is changed)
    build-frontend:
        needs: detect-changes
        if: needs.detect-changes.outputs.frontend == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
            
            - name: Log in to Docker Hub
              uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
                
            - name: Build and push frontend
              uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # docker/build-push-action@v5
              with:
                context: ./frontend
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer-web:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer-web:${{ needs.detect-changes.outputs.current_tag }}
                build-args: |
                    API_BASE_URL=${{ secrets.API_BASE_URL }}
            
            - name: Log out from Docker Hub
              run: docker logout
    
    # Step 3: Build and push backend (only if backend changed)
    build-backend:
        needs: detect-changes
        if: needs.detect-changes.outputs.backend == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout Code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
            
            - name: Log in to Docker Hub
              uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # docker/login-action@v2
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_PASSWORD }}
                
            - name: Build and push backend
              uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # docker/build-push-action@v5
              with:
                context: .
                file: cmd/server/Dockerfile
                push: true
                tags: |
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer:latest
                    ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer:${{ needs.detect-changes.outputs.current_tag }}

            - name: Log out from Docker Hub
              run: docker logout

    # Step 4: Trivy vulnerability scan on built images
    scan-images:
        needs: [detect-changes, build-frontend, build-backend]
        if: always() && (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success')
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - name: Scan frontend image
              if: needs.build-frontend.result == 'success'
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer-web:${{ needs.detect-changes.outputs.current_tag }}
                format: sarif
                output: trivy-frontend.sarif
                severity: CRITICAL
                exit-code: '1'

            - name: Upload frontend SARIF to GitHub Code Scanning
              if: always() && needs.build-frontend.result == 'success'
              uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # github/codeql-action/upload-sarif@v3
              with:
                sarif_file: trivy-frontend.sarif
                category: trivy-frontend

            - name: Scan backend image
              if: needs.build-backend.result == 'success'
              uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/goinitializer:${{ needs.detect-changes.outputs.current_tag }}
                format: sarif
                output: trivy-backend.sarif
                severity: CRITICAL
                exit-code: '1'

            - name: Upload backend SARIF to GitHub Code Scanning
              if: always() && needs.build-backend.result == 'success'
              uses: github/codeql-action/upload-sarif@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # github/codeql-action/upload-sarif@v3
              with:
                sarif_file: trivy-backend.sarif
                category: trivy-backend

    # Step 5: Cross-compile goini and publish to GitHub Release + Homebrew tap (paused)
    release-cli:
        if: false # paused — re-enable when CLI release is ready
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Code
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # actions/setup-go@v5
              with:
                go-version-file: go.mod
                cache: true

            - name: Run goreleaser
              uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # goreleaser/goreleaser-action@v6
              with:
                distribution: goreleaser
                version: latest
                args: release --clean
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

            - name: Generate SBOM (SPDX)
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action@v0
              with:
                format: spdx-json
                artifact-name: sbom-spdx.json

            - name: Generate SBOM (CycloneDX)
              uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # anchore/sbom-action@v0
              with:
                format: cyclonedx-json
                artifact-name: sbom-cyclonedx.json

    create-summary:
        needs: [detect-changes, build-frontend, build-backend, scan-images, release-cli]
        runs-on: ubuntu-latest
        permissions: {}
        if: always() # Ensure this runs even if builds are skipped
        steps:
        - name: Generate Summary
          run: |
            echo "### 🚀 Release Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            
            if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
                echo "| Frontend | ✅ Built and Pushed |" >> $GITHUB_STEP_SUMMARY
            else
                echo "| Frontend | ⏩ Skipped (No changes) |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "${{ needs.detect-changes.outputs.backend }}" == "true" ]; then
                echo "| Backend | ✅ Built and Pushed |" >> $GITHUB_STEP_SUMMARY
            else
                echo "| Backend | ⏩ Skipped (No changes) |" >> $GITHUB_STEP_SUMMARY
            fi
            
            if [ "${{ needs.release-cli.result }}" == "success" ]; then
                echo "| CLI (goini) | ✅ Released via goreleaser |" >> $GITHUB_STEP_SUMMARY
            else
                echo "| CLI (goini) | ❌ goreleaser failed |" >> $GITHUB_STEP_SUMMARY
            fi