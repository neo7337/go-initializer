name: 🐍 Backend Build and Test

on:
    pull_request:
        branches: [main]
        paths:
            - 'cmd/server/**'
            - 'internal/**'
            - '.github/workflows/backend.yml'
    push:
        branches: [main]
        paths:
            - 'cmd/server/**'
            - 'internal/**'
            - '.github/workflows/backend.yml'

jobs:
    build_and_test_backend:
        name: Build Backend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: .
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.25'
            - name: Install dependencies
              run: go mod download
            - name: Build backend
              run: go build -v ./cmd/server/...